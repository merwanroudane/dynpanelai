[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynpanelai"
version = "0.1.2"
description = "Machine learning and modern inference for dynamic panel data models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
maintainers = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
keywords = [
    "econometrics",
    "dynamic panel data",
    "double machine learning",
    "Arellano-Bond",
    "GMM",
    "LASSO",
    "causal inference",
    "shrinkage",
    "forecasting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
neural = ["torch>=2.0"]
plots = ["matplotlib>=3.7"]
all = ["torch>=2.0", "matplotlib>=3.7", "statsmodels>=0.14"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "matplotlib>=3.7",
    "torch>=2.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/merwanroudane/dynpanelai"
Repository = "https://github.com/merwanroudane/dynpanelai"
Issues = "https://github.com/merwanroudane/dynpanelai/issues"

[tool.setuptools.packages.find]
include = ["dynpanelai*"]

[tool.setuptools.package-data]
"dynpanelai.datasets" = ["data/*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Do NOT silence UserWarning globally: this package uses warnings as its
# guardrail mechanism (instrument proliferation, sqrt(N)/T, weak sparsity).
# Silencing them would hide exactly what the tests exist to verify.
filterwarnings = [
    "ignore:.*n_alphas.*:FutureWarning",
    "ignore::DeprecationWarning:sklearn.*",
]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "E741", "F841"]
